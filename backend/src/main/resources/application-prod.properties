# 本番環境（AWS の ECS Fargate）用の設定。環境変数 SPRING_PROFILES_ACTIVE=prod のときだけ読まれ、
# application.properties の同じ項目を上書きする（インフラ設計書 7.2）。
#
# DB の接続先・ユーザー名・パスワードはここに書かない。ECS のタスク定義から次の環境変数で渡し、
# application.properties のローカル用の値を上書きする（Spring Boot が大文字・アンダースコアの名前を
# spring.datasource.url などに自動で対応づける）。
#   SPRING_DATASOURCE_URL       jdbc:postgresql://<RDS のエンドポイント>:5432/taskmanagement
#   SPRING_DATASOURCE_USERNAME  taskmanagement
#   SPRING_DATASOURCE_PASSWORD  Secrets Manager から注入する（インフラ設計書 9.1）

# --- Flyway ----------------------------------------------------------------
# 開発用のサンプルデータ（db/sample の V3）は本番に入れない（データ設計書 10.4）。
spring.flyway.locations=classpath:db/migration

# --- JPA -------------------------------------------------------------------
# SQL のログは学習・調査用。本番ではログが膨らむので出さない。
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
