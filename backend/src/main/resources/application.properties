spring.application.name=backend

# --- データベース接続設定 -------------------------------------------------
# 接続先はリポジトリ直下の compose.yaml で起動する PostgreSQL。
# ユーザー名・パスワード・DB 名は compose.yaml の environment と一致させる。
# ローカル開発専用の値のため、そのままリポジトリに含めている。
spring.datasource.url=jdbc:postgresql://localhost:5432/taskmanagement
spring.datasource.username=taskmanagement
spring.datasource.password=taskmanagement

# --- JPA（Java のクラスとテーブルの対応づけ） -----------------------------
# テーブルの作成・変更は Flyway だけが行う。JPA には一切作らせない。
spring.jpa.hibernate.ddl-auto=none
# 実行された SQL をログに出す（学習・調査用。本番では無効にする）。
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Flyway（テーブル定義の履歴管理） -------------------------------------
# 起動時に src/main/resources/db/migration の SQL を順に適用する。
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
